# E2. Off-centre crowd with signs. Both doors are 3 m wide.
# The spawn is nearer the left door. The same signs as E1 name both exits.
name: e2-offcentre-signed
width: 100
height: 60
tom_order: 0
agents:
  count: 80
  radius: 0.3
  desired_speed: 2.0
  spawn_region:
    min: [32, 22]
    max: [42, 34]
perception:
  view_range: 40
  fov_deg: 360
exits:
  - {side: north, center: 30, width: 3, name: left}
  - {side: north, center: 70, width: 3, name: right}
signs:
  - {position: [37, 18], exit_index: 0}
  - {position: [39, 18], exit_index: 1}
obstacles:
  walls: []
  circles: []
tom_options:
  - tom_order: 0                         
  - tom_order: 1                         
  - tom_proportions: {tom0: 0.5, tom1: 0.5}
  - tom_order: 'reactive'                    

# Train platform with the hallway shifted toward the top.
# Bounding box 100 m by 60 m, the same as the room scenes. North is y = 0.
# The window scales by width, so this size shows the full height, like the rooms.
# Hallway: x = [0, 20], y = [12.5, 22.5] (10 m wide, centered at y = 17.5).
# Platform: x = [20, 100]. Depth is 80 m because the doors stay on the east wall.
# Four east-boundary doors, each 3 m wide. Crossing one means boarding.
# The mouth at x = 20, y = [12.5, 22.5] stays open. The rest of the platform's left edge is walled.
# The west boundary wall is the back of the hallway. No wall is duplicated on the outer boundary.
# Preview policy is homogeneous ToM-0. tom_options lists the later study compositions.
name: train-upper-middle-hallway
width: 100
height: 60
tom_order: 0
agents:
  count: 80
  radius: 0.3
  desired_speed: 2.0
  spawn_region:
    min: [2, 13.5]
    max: [17, 21.5]
perception:
  view_range: 40
  fov_deg: 360
exits:
  - {side: east, center: 7.5, width: 3, name: door_0}
  - {side: east, center: 22.5, width: 3, name: door_1}
  - {side: east, center: 37.5, width: 3, name: door_2}
  - {side: east, center: 52.5, width: 3, name: door_3}
signs:
  - {position: [20, 14.5], exit_index: 0}
  - {position: [20, 16.5], exit_index: 1}
  - {position: [20, 18.5], exit_index: 2}
  - {position: [20, 20.5], exit_index: 3}
obstacles:
  walls:
    - {start: [0, 12.5], end: [20, 12.5]}
    - {start: [0, 22.5], end: [20, 22.5]}
    - {start: [20, 0], end: [20, 12.5]}
    - {start: [20, 22.5], end: [20, 60]}
  circles: []
tom_options:
  - {tom_order: reactive}
  - {tom_order: 0}
  - {tom_order: 1}
  - {tom_proportions: {tom0: 0.5, tom1: 0.5}}

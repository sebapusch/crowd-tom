# Diagnostic scene for ToM1's predicted-demand term.
# Both exits are visible to the agents. Most begin slightly nearer the left exit,
# while nearby agents are mainly beside one another rather than ahead in the
# north-pointing occupancy cones. ToM0 therefore favors left; ToM1 anticipates
# that choice by others and sends some agents to the right exit.
# The ToM1 settings deliberately amplify the contrast for this demonstration.
name: tom1-demand-contrast
width: 100
height: 60
tom_order: 1
agents:
  count: 20
  radius: 0.3
  desired_speed: 2.0
  spawn_region:
    min: [40, 24]
    max: [49, 27]
perception:
  view_range: 45
  fov_deg: 360
tom1:
  memory_agents: 32
  choice_temperature: 0.2
  demand_half_count: 4.0
  demand_weight: -1.0
exits:
  - {side: north, center: 30, width: 3, name: left}
  - {side: north, center: 70, width: 3, name: right}
obstacles:
  walls: []
  circles: []

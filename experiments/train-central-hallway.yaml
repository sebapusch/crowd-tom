# Train platform with a central hallway.
# Bounding box 100 m by 60 m, the same as the room scenes. North is y = 0.
# The window scales by width, so a 40 m wide map was cropped and the middle hallway
# sat too low. This size shows the full 60 m height at the same scale as the rooms.
# Hallway: x = [0, 20], y = [25, 35] (10 m wide, centered at y = 30).
# Platform: x = [20, 100]. Depth is 80 m because the doors stay on the east wall.
# Four east-boundary doors, each 3 m wide. Crossing one means boarding.
# The mouth at x = 20, y = [25, 35] stays open. The rest of the platform's left edge is walled.
# The west boundary wall is the back of the hallway. No wall is duplicated on the outer boundary.
# Preview policy is homogeneous ToM-0. tom_options lists the later study compositions.
name: train-central-hallway
width: 100
height: 60
tom_order: 0
agents:
  count: 80
  radius: 0.3
  desired_speed: 2.0
  spawn_region:
    min: [2, 26]
    max: [17, 34]
perception:
  view_range: 40
  fov_deg: 360
exits:
  - {side: east, center: 7.5, width: 3, name: door_0}
  - {side: east, center: 22.5, width: 3, name: door_1}
  - {side: east, center: 37.5, width: 3, name: door_2}
  - {side: east, center: 52.5, width: 3, name: door_3}
signs:
  - {position: [20, 27], exit_index: 0}
  - {position: [20, 29], exit_index: 1}
  - {position: [20, 31], exit_index: 2}
  - {position: [20, 33], exit_index: 3}
obstacles:
  walls:
    - {start: [0, 25], end: [20, 25]}
    - {start: [0, 35], end: [20, 35]}
    - {start: [20, 0], end: [20, 25]}
    - {start: [20, 35], end: [20, 60]}
  circles: []
tom_options:
  - {tom_order: reactive}
  - {tom_order: 0}
  - {tom_order: 1}
  - {tom_proportions: {tom0: 0.5, tom1: 0.5}}
